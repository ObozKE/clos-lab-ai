# AI Data Center Spine-Leaf Fabric Digital Twin
# Single Source of Truth Topology Definition (RFC 7938 Clos + RFC 8365 EVPN-VXLAN)

fabric:
  name: ai-fabric
  spine_asn: 65000
  mtu_fabric: 9000
  mtu_host: 1500
  p2p_subnet_base: "10.0.0.0/16"
  vrf:
    name: "TENANT-A"
    table: 1001
    l3vni: 50001
    vlan: 501
  vlan:
    id: 100
    name: "compute-vlan100"
    subnet: "10.100.0.0/24"
    anycast_gateway: "10.100.0.1/24"
    anycast_mac: "00:00:5e:00:01:01"
    l2vni: 10100

images:
  frr: "frrouting/frr:v8.4.1"
  host: "wbitt/network-multitool:alpine-minimal"

spines:
  - name: spine1
    id: 1
    loopback: "10.255.0.1/32"
    asn: 65000
  - name: spine2
    id: 2
    loopback: "10.255.0.2/32"
    asn: 65000

# Adding a leaf here will automatically wire spine connections, assign P2P /31 subnets,
# allocate ASNs, and attach simulated GPU compute hosts.
leaves:
  - name: leaf1
    id: 1
    asn: 65101
    loopback: "10.255.1.1/32"
    vtep_ip: "10.255.1.1"
  - name: leaf2
    id: 2
    asn: 65102
    loopback: "10.255.1.2/32"
    vtep_ip: "10.255.1.2"
  - name: leaf3
    id: 3
    asn: 65103
    loopback: "10.255.1.3/32"
    vtep_ip: "10.255.1.3"
  - name: leaf4
    id: 4
    asn: 65104
    loopback: "10.255.1.4/32"
    vtep_ip: "10.255.1.4"

hosts:
  - name: h1
    id: 1
    leaf: leaf1
    leaf_port: eth3
    ip: "10.100.0.11/24"
    gateway: "10.100.0.1"
  - name: h2
    id: 2
    leaf: leaf1
    leaf_port: eth4
    ip: "10.100.0.12/24"
    gateway: "10.100.0.1"
  - name: h3
    id: 3
    leaf: leaf2
    leaf_port: eth3
    ip: "10.100.0.13/24"
    gateway: "10.100.0.1"
  - name: h4
    id: 4
    leaf: leaf2
    leaf_port: eth4
    ip: "10.100.0.14/24"
    gateway: "10.100.0.1"
  - name: h5
    id: 5
    leaf: leaf3
    leaf_port: eth3
    ip: "10.100.0.15/24"
    gateway: "10.100.0.1"
  - name: h6
    id: 6
    leaf: leaf3
    leaf_port: eth4
    ip: "10.100.0.16/24"
    gateway: "10.100.0.1"
  - name: h7
    id: 7
    leaf: leaf4
    leaf_port: eth3
    ip: "10.100.0.17/24"
    gateway: "10.100.0.1"
  - name: h8
    id: 8
    leaf: leaf4
    leaf_port: eth4
    ip: "10.100.0.18/24"
    gateway: "10.100.0.1"
