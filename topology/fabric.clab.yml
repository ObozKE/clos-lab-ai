name: ai-fabric

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    linux:
      cmd: /bin/sh
  nodes:
    # -------------------------------------------------------------
    # Spines (Underlay eBGP & Overlay EVPN Route Reflectors)
    # -------------------------------------------------------------
    spine1:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - configs/spine1/daemons:/etc/frr/daemons
        - configs/spine1/frr.conf:/etc/frr/frr.conf
        - configs/spine1/setup.sh:/etc/frr/setup.sh
      exec:
        - /bin/sh /etc/frr/setup.sh
    spine2:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - configs/spine2/daemons:/etc/frr/daemons
        - configs/spine2/frr.conf:/etc/frr/frr.conf
        - configs/spine2/setup.sh:/etc/frr/setup.sh
      exec:
        - /bin/sh /etc/frr/setup.sh

    # -------------------------------------------------------------
    # Leaves (VTEPs, eBGP Underlay, EVPN Symmetric IRB Anycast GW)
    # -------------------------------------------------------------
    leaf1:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - configs/leaf1/daemons:/etc/frr/daemons
        - configs/leaf1/frr.conf:/etc/frr/frr.conf
        - configs/leaf1/setup.sh:/etc/frr/setup.sh
      exec:
        - /bin/sh /etc/frr/setup.sh
    leaf2:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - configs/leaf2/daemons:/etc/frr/daemons
        - configs/leaf2/frr.conf:/etc/frr/frr.conf
        - configs/leaf2/setup.sh:/etc/frr/setup.sh
      exec:
        - /bin/sh /etc/frr/setup.sh
    leaf3:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - configs/leaf3/daemons:/etc/frr/daemons
        - configs/leaf3/frr.conf:/etc/frr/frr.conf
        - configs/leaf3/setup.sh:/etc/frr/setup.sh
      exec:
        - /bin/sh /etc/frr/setup.sh
    leaf4:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - configs/leaf4/daemons:/etc/frr/daemons
        - configs/leaf4/frr.conf:/etc/frr/frr.conf
        - configs/leaf4/setup.sh:/etc/frr/setup.sh
      exec:
        - /bin/sh /etc/frr/setup.sh

    # -------------------------------------------------------------
    # Simulated GPU Compute Hosts
    # -------------------------------------------------------------
    h1:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      binds:
        - configs/h1/setup.sh:/etc/setup.sh
      exec:
        - /bin/sh /etc/setup.sh
    h2:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      binds:
        - configs/h2/setup.sh:/etc/setup.sh
      exec:
        - /bin/sh /etc/setup.sh
    h3:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      binds:
        - configs/h3/setup.sh:/etc/setup.sh
      exec:
        - /bin/sh /etc/setup.sh
    h4:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      binds:
        - configs/h4/setup.sh:/etc/setup.sh
      exec:
        - /bin/sh /etc/setup.sh
    h5:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      binds:
        - configs/h5/setup.sh:/etc/setup.sh
      exec:
        - /bin/sh /etc/setup.sh
    h6:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      binds:
        - configs/h6/setup.sh:/etc/setup.sh
      exec:
        - /bin/sh /etc/setup.sh
    h7:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      binds:
        - configs/h7/setup.sh:/etc/setup.sh
      exec:
        - /bin/sh /etc/setup.sh
    h8:
      kind: linux
      image: wbitt/network-multitool:alpine-minimal
      binds:
        - configs/h8/setup.sh:/etc/setup.sh
      exec:
        - /bin/sh /etc/setup.sh

  # ---------------------------------------------------------------
  # Point-to-Point Links (Clos Bipartite Fabric & Host Access)
  # ---------------------------------------------------------------
  links:
    # Spine-Leaf Interconnects
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]

    # Leaf-Host Interconnects
    - endpoints: ["leaf1:eth3", "h1:eth1"]
    - endpoints: ["leaf1:eth4", "h2:eth1"]
    - endpoints: ["leaf2:eth3", "h3:eth1"]
    - endpoints: ["leaf2:eth4", "h4:eth1"]
    - endpoints: ["leaf3:eth3", "h5:eth1"]
    - endpoints: ["leaf3:eth4", "h6:eth1"]
    - endpoints: ["leaf4:eth3", "h7:eth1"]
    - endpoints: ["leaf4:eth4", "h8:eth1"]
