name: Lint and Validate Fabric Architecture

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2 yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 180}}}" topology/topology.yml

      - name: Test Configuration Generator
        run: |
          python scripts/generate_configs.py

      - name: Verify Generated Containerlab Topology
        run: |
          test -f topology/fabric.clab.yml
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 180}}}" topology/fabric.clab.yml
