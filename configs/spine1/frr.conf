frr version 8.4
frr defaults traditional
hostname spine1
log stdout informational
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description to_leaf1_eth1
 ip address 10.0.0.0/31
 ip mtu 9000
!
interface eth2
 description to_leaf2_eth1
 ip address 10.0.0.2/31
 ip mtu 9000
!
interface eth3
 description to_leaf3_eth1
 ip address 10.0.0.4/31
 ip mtu 9000
!
interface eth4
 description to_leaf4_eth1
 ip address 10.0.0.6/31
 ip mtu 9000
!
!
router bgp 65000
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 !
 neighbor 10.0.0.1 remote-as 65101
 neighbor 10.0.0.1 description leaf1
 neighbor 10.0.0.1 timers 3 9
 neighbor 10.0.0.1 capability extended-nexthop
 neighbor 10.0.0.3 remote-as 65102
 neighbor 10.0.0.3 description leaf2
 neighbor 10.0.0.3 timers 3 9
 neighbor 10.0.0.3 capability extended-nexthop
 neighbor 10.0.0.5 remote-as 65103
 neighbor 10.0.0.5 description leaf3
 neighbor 10.0.0.5 timers 3 9
 neighbor 10.0.0.5 capability extended-nexthop
 neighbor 10.0.0.7 remote-as 65104
 neighbor 10.0.0.7 description leaf4
 neighbor 10.0.0.7 timers 3 9
 neighbor 10.0.0.7 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.255.0.1/32
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.5 activate
  neighbor 10.0.0.7 activate
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  bgp retain-route-target all
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 next-hop-unchanged
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.3 next-hop-unchanged
  neighbor 10.0.0.5 activate
  neighbor 10.0.0.5 next-hop-unchanged
  neighbor 10.0.0.7 activate
  neighbor 10.0.0.7 next-hop-unchanged
 exit-address-family
!
line vty
!