frr version 8.4
frr defaults traditional
hostname spine2
log stdout informational
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 description to_leaf1_eth2
 ip address 10.0.0.8/31
!
interface eth2
 description to_leaf2_eth2
 ip address 10.0.0.10/31
!
interface eth3
 description to_leaf3_eth2
 ip address 10.0.0.12/31
!
interface eth4
 description to_leaf4_eth2
 ip address 10.0.0.14/31
!
!
router bgp 65000
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 !
 neighbor 10.0.0.9 remote-as 65101
 neighbor 10.0.0.9 description leaf1
 neighbor 10.0.0.9 timers 3 9
 neighbor 10.0.0.9 capability extended-nexthop
 neighbor 10.0.0.11 remote-as 65102
 neighbor 10.0.0.11 description leaf2
 neighbor 10.0.0.11 timers 3 9
 neighbor 10.0.0.11 capability extended-nexthop
 neighbor 10.0.0.13 remote-as 65103
 neighbor 10.0.0.13 description leaf3
 neighbor 10.0.0.13 timers 3 9
 neighbor 10.0.0.13 capability extended-nexthop
 neighbor 10.0.0.15 remote-as 65104
 neighbor 10.0.0.15 description leaf4
 neighbor 10.0.0.15 timers 3 9
 neighbor 10.0.0.15 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.255.0.2/32
  redistribute connected
  neighbor 10.0.0.9 activate
  neighbor 10.0.0.9 allowas-in 1
  neighbor 10.0.0.11 activate
  neighbor 10.0.0.11 allowas-in 1
  neighbor 10.0.0.13 activate
  neighbor 10.0.0.13 allowas-in 1
  neighbor 10.0.0.15 activate
  neighbor 10.0.0.15 allowas-in 1
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  bgp retain-route-target all
  neighbor 10.0.0.9 activate
  neighbor 10.0.0.9 next-hop-unchanged
  neighbor 10.0.0.9 allowas-in 1
  neighbor 10.0.0.11 activate
  neighbor 10.0.0.11 next-hop-unchanged
  neighbor 10.0.0.11 allowas-in 1
  neighbor 10.0.0.13 activate
  neighbor 10.0.0.13 next-hop-unchanged
  neighbor 10.0.0.13 allowas-in 1
  neighbor 10.0.0.15 activate
  neighbor 10.0.0.15 next-hop-unchanged
  neighbor 10.0.0.15 allowas-in 1
 exit-address-family
!
line vty
!