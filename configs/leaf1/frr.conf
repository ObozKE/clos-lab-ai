frr version 8.4
frr defaults traditional
hostname leaf1
log stdout informational
no ipv6 forwarding
!
vrf TENANT-A
 vni 50001
exit-vrf
!
interface lo
 ip address 10.255.1.1/32
!
interface eth1
 description to_spine1
 ip address 10.0.0.1/31
!
interface eth2
 description to_spine2
 ip address 10.0.0.9/31
!
router bgp 65101
 bgp router-id 10.255.1.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 !
 neighbor 10.0.0.0 remote-as 65000
 neighbor 10.0.0.0 description spine1
 neighbor 10.0.0.0 timers 3 9
 neighbor 10.0.0.0 capability extended-nexthop
 !
 neighbor 10.0.0.8 remote-as 65000
 neighbor 10.0.0.8 description spine2
 neighbor 10.0.0.8 timers 3 9
 neighbor 10.0.0.8 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.255.1.1/32
  redistribute connected
  neighbor 10.0.0.0 activate
  neighbor 10.0.0.8 activate
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.0.0 activate
  neighbor 10.0.0.8 activate
  advertise-all-vni
  advertise-default-gw
  vni 10100
   rd 10.255.1.1:10100
   route-target both 65000:10100
  exit-vni
 exit-address-family
!
router bgp 65101 vrf TENANT-A
 bgp router-id 10.255.1.1
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 10.255.1.1:50001
  route-target both 65000:50001
 exit-address-family
!
line vty
!