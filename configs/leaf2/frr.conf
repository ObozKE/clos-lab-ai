frr version 8.4
frr defaults traditional
hostname leaf2
log stdout informational
no ipv6 forwarding
!
interface lo
 ip address 10.255.1.2/32
!
interface eth1
 description to_spine1
 ip address 10.0.0.3/31
 ip mtu 9000
!
interface eth2
 description to_spine2
 ip address 10.0.0.11/31
 ip mtu 9000
!
router bgp 65102
 bgp router-id 10.255.1.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 !
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 description spine1
 neighbor 10.0.0.2 timers 3 9
 neighbor 10.0.0.2 capability extended-nexthop
 !
 neighbor 10.0.0.10 remote-as 65000
 neighbor 10.0.0.10 description spine2
 neighbor 10.0.0.10 timers 3 9
 neighbor 10.0.0.10 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.255.1.2/32
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.10 activate
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.10 activate
  advertise-all-vni
  advertise-default-gw
 exit-address-family
!
router bgp 65102 vrf TENANT-A
 bgp router-id 10.255.1.2
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
line vty
!