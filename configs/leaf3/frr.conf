frr version 8.4
frr defaults traditional
hostname leaf3
log stdout informational
no ipv6 forwarding
!
interface lo
 ip address 10.255.1.3/32
!
interface eth1
 description to_spine1
 ip address 10.0.0.5/31
 ip mtu 9000
!
interface eth2
 description to_spine2
 ip address 10.0.0.13/31
 ip mtu 9000
!
router bgp 65103
 bgp router-id 10.255.1.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 !
 neighbor 10.0.0.4 remote-as 65000
 neighbor 10.0.0.4 description spine1
 neighbor 10.0.0.4 timers 3 9
 neighbor 10.0.0.4 capability extended-nexthop
 !
 neighbor 10.0.0.12 remote-as 65000
 neighbor 10.0.0.12 description spine2
 neighbor 10.0.0.12 timers 3 9
 neighbor 10.0.0.12 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.255.1.3/32
  redistribute connected
  neighbor 10.0.0.4 activate
  neighbor 10.0.0.12 activate
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.0.4 activate
  neighbor 10.0.0.12 activate
  advertise-all-vni
  advertise-default-gw
 exit-address-family
!
router bgp 65103 vrf TENANT-A
 bgp router-id 10.255.1.3
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
line vty
!